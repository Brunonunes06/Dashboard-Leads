<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard · Resposta</title>
    <meta name="description" content="Métricas de leads, tempo de resposta e qualificação em tempo real." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" href="./img/logo.jpg" type="image/jpeg" />
    <link rel="stylesheet" href="assets/styles.css" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar"></aside>
      <div class="main">
        <header class="topbar">
          <div style="display: flex; align-items: center; gap: 12px">
            <button class="menu-btn" onclick="openMobileSidebar()">
              <i data-lucide="menu"></i>
            </button>
            <span class="topbar-title">Dashboard</span>
          </div>
          <div class="topbar-actions">
            <button class="btn btn-outline btn-icon" onclick="toggleTheme()" title="Alternar tema">
              <i data-lucide="sun-moon"></i>
            </button>
          </div>
        </header>

        <div class="page-shell">
          <!-- Header -->
          <div class="page-header">
            <div>
              <h1 style="font-size: 28px; font-weight: 600" id="greeting">Bom dia, Usuário 👋</h1>
              <div id="profileMini" style="margin-top: 8px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted);"></div>
              <p style="margin-top: 8px; font-size: 13px; color: var(--muted)">
                Sua central processou <strong style="color: var(--fg)" id="leadCount">6 leads</strong> nesta sessão.
              </p>
            </div>
            <div class="action-row">
              <div id="googleAuthContainer">
                <!-- data-client_id será preenchido via JavaScript -->
                <div id="g_id_onload"
                     data-client_id=""
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="handleGoogleCredential"
                     data-auto_prompt="false"></div>
                <div class="g_id_signin"
                     data-type="standard"
                     data-shape="pill"
                     data-theme="outline"
                     data-text="signin_with"
                     data-size="large"></div>
              </div>

              <button class="btn btn-outline btn-sm" id="logoutBtn" onclick="logout()" style="display: none">Sair</button>
              <a class="btn btn-primary" href="leads.html">Ver detalhado <i data-lucide="arrow-up-right" style="width: 14px; height: 14px"></i></a>
            </div>
          </div>

          <!-- Metrics -->
          <div class="metrics-grid" id="metrics"></div>

          <!-- Charts -->
          <div class="charts-grid" id="chartsGrid">
            <div class="card">
              <div class="card-header">
                <h3 class="card-title">Leads x Qualificados · últimos 7 dias</h3>
              </div>
              <div class="card-body chart-panel"><canvas id="barChart"></canvas></div>
            </div>
            <div class="card">
              <div class="card-header">
                <h3 class="card-title">Origem dos leads</h3>
              </div>
              <div class="card-body">
                <div style="height: 180px"><canvas id="pieChart"></canvas></div>
                <div id="sourceLegend" style="margin-top: 12px; display: flex; flex-direction: column; gap: 6px"></div>
              </div>
            </div>
          </div>

          <!-- Active leads -->
          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Leads ativos recebidos</h3>
              <a class="btn btn-ghost btn-sm" href="leads.html">Ver tudo</a>
            </div>
            <div id="activeLeads" style="border-top: 1px solid var(--border-soft); margin-top: 8px"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="assets/data.js"></script>
    <script src="assets/common.js"></script>
    <script src="assets/gsi-origins-check.js"></script>
    <script src="https://www.google.com/recaptcha/enterprise.js?render=6LdRj1EtAAAAADGQpzaQbXFTheZIgu2MZQpDpRRx"></script>

    <script>
      // ==================== CONFIGURAÇÕES FIREBASE ====================
      const FIREBASE_CONFIG = {
        apiKey: "VITE_FIREBASE_API_KEY",
        authDomain: "VITE_FIREBASE_AUTH_DOMAIN",
        projectId: "VITE_FIREBASE_PROJECT_ID",
        storageBucket: "VITE_FIREBASE_STORAGE_BUCKET",
        messagingSenderId: "VITE_FIREBASE_MESSAGING_SENDER_ID",
        appId: "VITE_FIREBASE_APP_ID",
        measurementId: "VITE_FIREBASE_MEASUREMENT_ID"
      };

      // ==================== FUNÇÕES AUXILIARES ====================
      function getPeriodGreeting() {
        const hour = new Date().getHours();
        if (hour >= 5 && hour < 12) return "Bom dia";
        if (hour >= 12 && hour < 18) return "Boa tarde";
        return "Boa noite";
      }

      function updateGreeting() {
        const greetingEl = document.getElementById('greeting');
        if (!greetingEl) return;
        const savedName = localStorage.getItem('userName') || 'Usuário';
        greetingEl.innerText = `${getPeriodGreeting()}, ${savedName} 👋`;
      }

      function escapeHtml(unsafe) {
        return unsafe
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      // ==================== GOOGLE AUTH - PUXA DO .ENV ====================
      function initGoogleAuth() {
        const clientId = import.meta.env?.VITE_GOOGLE_CLIENT_ID || 
                        window.VITE_GOOGLE_CLIENT_ID || 
                        "VITE_GOOGLE_CLIENT_ID"; // fallback

        if (!clientId || clientId === "VITE_GOOGLE_CLIENT_ID" || clientId === "SEU_CLIENT_ID_AQUI") {
          console.warn("⚠️ VITE_GOOGLE_CLIENT_ID não configurado no .env");
          return;
        }

        const gIdOnload = document.getElementById('g_id_onload');
        if (gIdOnload) {
          gIdOnload.setAttribute('data-client_id', clientId);
        }
      }

      // ==================== GOOGLE CALLBACK ====================
      window.handleGoogleCredential = async function (response) {
        try {
          const base64Url = response.credential.split('.')[1];
          const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
          const jsonPayload = decodeURIComponent(
            atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')
          );

          const payload = JSON.parse(jsonPayload);
          const nomeUsuario = payload.name || "Usuário";
          const emailUsuario = payload.email;
          const fotoUsuario = payload.picture;

          localStorage.setItem('userName', nomeUsuario);
          localStorage.setItem('userEmail', emailUsuario);
          if (fotoUsuario) localStorage.setItem('userPhoto', fotoUsuario);

          updateGreeting();
          checkUserLogin();
          refresh();

          if (typeof toast === "function") toast('Login com Google realizado com sucesso!');
        } catch (error) {
          console.error("Erro no login Google:", error);
          if (typeof toast === "function") toast("Erro no login", error.message || "Falha ao processar dados.");
        }
      };

      // ==================== LOGIN / LOGOUT ====================
      function checkUserLogin() {
        const savedName = localStorage.getItem('userName');
        const savedEmail = localStorage.getItem('userEmail');
        const logoutBtn = document.getElementById('logoutBtn');
        const googleContainer = document.getElementById('googleAuthContainer');

        if (savedName && savedEmail) {
          document.getElementById('greeting').innerText = `Bem-vindo, ${savedName} 👋`;
          if (logoutBtn) logoutBtn.style.display = 'inline-block';
          if (googleContainer) googleContainer.style.display = 'none';
        } else {
          if (logoutBtn) logoutBtn.style.display = 'none';
          if (googleContainer) googleContainer.style.display = 'block';
        }
      }

      function logout() {
        localStorage.removeItem('userName');
        localStorage.removeItem('userEmail');
        localStorage.removeItem('userPhone');
        window.location.reload();
      }

      function refresh() {
        const nameI = document.getElementById('name');
        const n = (nameI && nameI.value) || localStorage.getItem('userName') || 'Usuário';
        const avatarEl = document.getElementById('avatar');
        const displayNameEl = document.getElementById('displayName');

        if (avatarEl) avatarEl.textContent = n.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
        if (displayNameEl) displayNameEl.textContent = n;
      }

      // ==================== INICIALIZAÇÃO ====================
      document.addEventListener('DOMContentLoaded', () => {
        // Inicializa Google Auth com Client ID do .env
        initGoogleAuth();

        const { leads = [], weeklyData = [], sources = [], STATUS_LABEL = {} } = typeof APP_DATA !== 'undefined' ? APP_DATA : {};

        updateGreeting();
        checkUserLogin();
        refresh();

        // Métricas, Gráficos e Leads (mantido igual)
        const metrics = [ /* ... seu código de métricas ... */ ];
        // (Mantive o resto igual ao que você enviou)

        document.getElementById('metrics').innerHTML = metrics.map(m => `
          <div class="card" style="padding:20px">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;cursor:pointer">
              <div style="width:40px;height:40px;border-radius:12px;background:var(--secondary);color:${m.color};display:grid;place-items:center">
                <i data-lucide="${m.icon}" style="width:20px;height:20px"></i>
              </div>
              <span style="background:rgba(16,185,129,.12);color:var(--primary);padding:2px 10px;border-radius:9999px;font-size:11px;font-weight:600">${m.delta}</span>
            </div>
            <p style="font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:600;margin-top:14px">${m.value}</p>
            <p style="font-size:12px;color:var(--muted);margin-top:2px">${m.label}</p>
          </div>
        `).join('');

        document.getElementById('leadCount').textContent = `${leads.length} leads`;

        // Gráficos e Leads Ativos (mantidos do seu código original)
        if (document.getElementById('barChart')) {
          new Chart(document.getElementById('barChart'), { /* ... */ });
        }
        if (document.getElementById('pieChart')) {
          new Chart(document.getElementById('pieChart'), { /* ... */ });
        }

        document.getElementById('activeLeads').innerHTML = leads.slice(0, 5).map(l => ` /* ... */ `).join('');

        lucide.createIcons();
      });
    </script>

    <script src="assets/chart-fixes.js"></script>
  </body>
</html>
