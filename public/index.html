<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard · TEAM WOLF</title>
    <script>
      (function () {
        var t = localStorage.getItem("resposta-theme") || "dark";
        var r = t === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : t;
        document.documentElement.classList.add(r);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/theme.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <script src="/assets/vendor/supabase.js"></script>
    <script src="/config.js"></script>
    <script src="/assets/vendor/lucide.min.js"></script>
    <script src="/assets/vendor/chart.umd.min.js"></script>
    <script src="/assets/js/theme.js"></script>
    <script src="/assets/js/i18n.js"></script>
    <script src="/assets/js/supabase-client.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/status-badge.js"></script>
    <script src="/assets/js/nav.js"></script>
    <script src="/assets/js/cookie-consent.js"></script>
    <script src="/assets/js/google-translate.js"></script>
    <script src="/assets/js/recaptcha-client.js"></script>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo"><i data-lucide="zap"></i></div>
          <div class="sidebar-brand">
            <strong>TEAM WOLF</strong>
            <span>SaaS de leads</span>
          </div>
        </div>
        <div class="sidebar-group-label" data-i18n="nav.platform"></div>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-footer hidden" id="sidebar-footer">
          <div class="sidebar-footer-card">
            <i data-lucide="sparkles"></i>
            <div><strong>IA ativa 24/7</strong><span>Respondendo em ~3s</span></div>
          </div>
        </div>
      </aside>
      <div class="sidebar-overlay" id="sidebar-overlay"></div>

      <div class="main-area">
        <header class="topbar">
          <button class="btn btn-ghost btn-icon" id="sidebar-toggle" aria-label="Toggle Sidebar">
            <i data-lucide="panel-left"></i>
          </button>
          <div id="google_translate_element" class="hidden notranslate"></div>
          <div class="topbar-spacer">
            <span id="auth-area"></span>
            <button class="btn btn-ghost btn-icon" id="theme-toggle" aria-label="Alternar tema">
              <i data-lucide="sun-moon"></i>
            </button>
          </div>
        </header>

        <main class="page" id="page-content">
          <div style="display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 1rem">
            <div>
              <h1 id="greeting" style="font-size: 1.5rem; font-weight: 600"></h1>
              <p id="subtitle" class="text-muted" style="margin-top: 0.5rem; font-size: 0.875rem"></p>
            </div>
            <div class="flex-row gap-2">
              <span id="dashboard-auth-area"></span>
              <a href="/leads/chat.html" class="btn btn-primary">
                <span data-i18n="common.viewDetails"></span>
                <i data-lucide="arrow-up-right" style="width: 0.85rem; height: 0.85rem"></i>
              </a>
            </div>
          </div>

          <div class="metrics-grid" id="metrics-grid"></div>

          <div class="grid-2">
            <div class="card">
              <div class="card-header">
                <div class="card-title" data-i18n="dashboard.chartTitle"></div>
              </div>
              <div class="card-body" style="height: 220px">
                <canvas id="weekly-chart"></canvas>
              </div>
            </div>

            <div class="card">
              <div class="card-header">
                <div class="card-title" data-i18n="dashboard.sourcesTitle"></div>
              </div>
              <div class="card-body flex-row gap-2" style="height: 220px; align-items: center">
                <div style="height: 160px; width: 160px; flex-shrink: 0">
                  <canvas id="sources-chart"></canvas>
                </div>
                <div id="sources-legend" style="flex: 1; display: flex; flex-direction: column; gap: 0.5rem"></div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header row">
              <div class="card-title" data-i18n="dashboard.activeLeads"></div>
              <a href="/leads/chat.html" style="font-size: 0.75rem; color: var(--primary)" data-i18n="common.viewAll"></a>
            </div>
            <div id="active-leads" style="padding-bottom: 0.25rem"></div>
          </div>
        </main>
      </div>
    </div>

    <div class="overlay" id="block-dialog" hidden>
      <div class="dialog">
        <h2>Acesso bloqueado</h2>
        <p id="block-dialog-message"></p>
        <div style="margin-top: 1rem; text-align: right">
          <button type="button" class="btn btn-primary" id="block-dialog-close">Entendi</button>
        </div>
      </div>
    </div>

    <script src="/assets/js/shell.js"></script>
    <script src="/assets/js/pages/dashboard.js"></script>
  </body>
</html>
