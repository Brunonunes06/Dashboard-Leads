<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Conversas · TEAM WOLF</title>
    <script>
      (function () {
        var t = localStorage.getItem("resposta-theme") || "dark";
        var r = t === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : t;
        document.documentElement.classList.add(r);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/theme.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
  </head>
  <body>
    <script src="/assets/vendor/supabase.js"></script>
    <script src="/config.js"></script>
    <script src="/assets/vendor/lucide.min.js"></script>
    <script src="/assets/js/theme.js"></script>
    <script src="/assets/js/i18n.js"></script>
    <script src="/assets/js/supabase-client.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/status-badge.js"></script>
    <script src="/assets/js/nav.js"></script>
    <script src="/assets/js/cookie-consent.js"></script>
    <script src="/assets/js/google-translate.js"></script>
    <script src="/assets/js/route-guard.js"></script>
    <script src="/assets/js/toast.js"></script>
    <script src="/assets/js/ai-reply-client.js"></script>

    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo"><i data-lucide="zap"></i></div>
          <div class="sidebar-brand">
            <strong>TEAM WOLF</strong>
            <span>SaaS de leads</span>
          </div>
        </div>
        <div class="sidebar-group-label" data-i18n="nav.platform"></div>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-footer hidden" id="sidebar-footer">
          <div class="sidebar-footer-card">
            <i data-lucide="sparkles"></i>
            <div><strong>IA ativa 24/7</strong><span>Respondendo em ~3s</span></div>
          </div>
        </div>
      </aside>
      <div class="sidebar-overlay" id="sidebar-overlay"></div>

      <div class="main-area">
        <header class="topbar">
          <button class="btn btn-ghost btn-icon" id="sidebar-toggle" aria-label="Toggle Sidebar">
            <i data-lucide="panel-left"></i>
          </button>
          <div id="google_translate_element" class="hidden notranslate"></div>
          <div class="topbar-spacer">
            <span id="auth-area"></span>
            <button class="btn btn-ghost btn-icon" id="theme-toggle" aria-label="Alternar tema">
              <i data-lucide="sun-moon"></i>
            </button>
          </div>
        </header>

        <main id="page-content" hidden style="display: grid; grid-template-columns: 300px 1fr; height: calc(100vh - 3.5rem); background: var(--background)">
          <!-- Lista de leads -->
          <div style="display: flex; flex-direction: column; border-right: 1px solid var(--border)">
            <div style="padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px">
              <span style="font-size: 15px; font-weight: 700" data-i18n="lead.messages"></span>
              <div style="position: relative">
                <i data-lucide="search" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--muted-foreground)"></i>
                <input
                  class="input"
                  id="chat-search"
                  data-i18n-placeholder="chat.searchPlaceholder"
                  style="padding-left: 30px; background: var(--secondary)"
                />
              </div>
              <div id="chat-filters" style="display: flex; flex-wrap: wrap; gap: 6px"></div>
            </div>
            <div id="chat-lead-list" style="flex: 1; overflow-y: auto"></div>
          </div>

          <!-- Estado vazio -->
          <div id="chat-empty-state" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px" class="text-muted">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            </svg>
            <p style="font-size: 13px" data-i18n="common.selectConversation"></p>
          </div>

          <!-- Janela de chat -->
          <div id="chat-window" style="display: none; flex-direction: column; height: 100%">
            <div style="display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--background)">
              <button
                type="button"
                id="chat-header-avatar-btn"
                title="Ver informações do lead"
                style="width: 40px; height: 40px; border-radius: 50%; background: var(--gradient-primary); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--primary-foreground); text-transform: uppercase; flex-shrink: 0; border: none; cursor: pointer; padding: 0"
              >
                <span id="chat-header-avatar"></span>
              </button>
              <div style="display: flex; flex-direction: column; min-width: 0; flex: 1">
                <span style="display: flex; align-items: center; gap: 8px; min-width: 0">
                  <span id="chat-header-name" class="truncate" style="font-size: 15px; font-weight: 600"></span>
                  <span id="chat-header-status"></span>
                </span>
              </div>
              <button
                type="button"
                id="chat-transfer-btn"
                style="margin-left: auto; display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 9999px; border: 1px solid color-mix(in srgb, var(--primary) 30%, transparent); font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0"
              >
                <i data-lucide="check-check" style="width: 14px; height: 14px"></i>
                <span></span>
              </button>
            </div>

            <div id="chat-messages" style="flex: 1; overflow-y: auto; padding: 18px 18px 10px; display: flex; flex-direction: column; gap: 4px"></div>

            <div style="padding: 12px 16px 16px; border-top: 1px solid var(--border)">
              <div style="display: flex; align-items: center; gap: 10px; background: var(--secondary); border-radius: 24px; padding: 8px 8px 8px 16px">
                <input
                  id="chat-input"
                  data-i18n-placeholder="chat.messagePlaceholder"
                  style="flex: 1; background: transparent; border: none; outline: none; font-size: 14.5px; color: var(--foreground)"
                />
                <button
                  type="button"
                  id="chat-ai-btn"
                  title="Gerar resposta com IA"
                  style="width: 36px; height: 36px; border-radius: 50%; background: transparent; border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0"
                >
                  <i data-lucide="sparkles" style="width: 15px; height: 15px; color: var(--chart-5)"></i>
                </button>
                <button
                  type="button"
                  id="chat-send-btn"
                  style="width: 40px; height: 40px; border-radius: 50%; background: var(--gradient-primary); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0"
                >
                  <i data-lucide="send" style="width: 16px; height: 16px; color: var(--primary-foreground)"></i>
                </button>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div class="overlay" id="lead-details-dialog" hidden>
      <div class="dialog">
        <div class="flex-row gap-2">
          <div id="lead-details-avatar" style="width: 64px; height: 64px; border-radius: 50%; background: var(--secondary); display: grid; place-items: center; font-size: 20px; font-weight: 700; text-transform: uppercase; flex-shrink: 0"></div>
          <div style="min-width: 0; flex: 1">
            <div id="lead-details-name" style="font-size: 20px; font-weight: 700"></div>
            <div id="lead-details-phone" class="text-muted" style="font-size: 13px; margin-top: 4px"></div>
            <div id="lead-details-status" style="margin-top: 10px"></div>
          </div>
          <button type="button" id="lead-details-close" style="width: 34px; height: 34px; border-radius: 9999px; border: 1px solid var(--border); background: var(--secondary); cursor: pointer" aria-label="Fechar">×</button>
        </div>

        <div style="margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
          <div style="border: 1px solid var(--border); border-radius: 14px; padding: 14px">
            <div class="text-muted" style="font-size: 11px; text-transform: uppercase" data-i18n="lead.score"></div>
            <div id="lead-details-score" style="font-size: 28px; font-weight: 800; color: var(--primary); margin-top: 6px"></div>
          </div>
          <div style="border: 1px solid var(--border); border-radius: 14px; padding: 14px">
            <div class="text-muted" style="font-size: 11px; text-transform: uppercase" data-i18n="lead.messages"></div>
            <div id="lead-details-messages" style="font-size: 20px; font-weight: 700; margin-top: 6px"></div>
          </div>
        </div>

        <div style="margin-top: 14px; border: 1px solid var(--border); border-radius: 14px; padding: 14px">
          <div class="text-muted" style="font-size: 11px; text-transform: uppercase" data-i18n="lead.info"></div>
          <div style="margin-top: 10px; display: grid; gap: 10px; font-size: 14px">
            <div><span class="text-muted" data-i18n="lead.phone"></span>: <span id="lead-details-phone2"></span></div>
            <div><span class="text-muted" data-i18n="lead.messages"></span>: <span id="lead-details-messages-count"></span></div>
            <div><span class="text-muted" data-i18n="lead.origin"></span>: <span id="lead-details-origin"></span></div>
          </div>
        </div>
      </div>
    </div>

    <script src="/assets/js/shell.js"></script>
    <script src="/assets/js/pages/chat.js"></script>
  </body>
</html>
